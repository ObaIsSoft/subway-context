<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="url(#bg)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">4-TIER STATION ALIASING HIERARCHY</text>
  <text x="480" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" text-anchor="middle">How Subway Context Eliminates Raw Hex UUIDs with Context-Aware Resolution</text>

  <!-- Metro Line Track -->
  <line x1="120" y1="120" x2="120" y2="460" stroke="#334155" stroke-width="6"/>

  <!-- Tier 1 -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="14" fill="#e11d48" stroke="#f8fafc" stroke-width="3"/>
    <rect x="40" y="-35" width="740" height="70" rx="10" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
    <text x="60" y="-12" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="700">TIER 1 (HIGHEST PRIORITY)</text>
    <text x="60" y="10" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Explicit Sticky Pins</text>
    <text x="60" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Assigned manually via tag_chat(). Immutable, zero drift when switching tabs.</text>
    <rect x="530" y="-18" width="230" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="5" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">@claude-main · @agy-live</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(120, 220)">
    <circle cx="0" cy="0" r="14" fill="#8b5cf6" stroke="#f8fafc" stroke-width="3"/>
    <rect x="40" y="-35" width="740" height="70" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="-12" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="700">TIER 2</text>
    <text x="60" y="10" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Floating Latest</text>
    <text x="60" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Dynamically resolves to the globally or per-platform most recently updated session.</text>
    <rect x="530" y="-18" width="230" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="5" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">@claude-latest · @agy-latest</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(120, 320)">
    <circle cx="0" cy="0" r="14" fill="#3b82f6" stroke="#f8fafc" stroke-width="3"/>
    <rect x="40" y="-35" width="740" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="-12" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="700">TIER 3</text>
    <text x="60" y="10" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Dynamic Workspace Heads</text>
    <text x="60" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Resolves to the most active session within a specific repository workspace directory.</text>
    <rect x="530" y="-18" width="230" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="5" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">@agy-dziner · @claude-web</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(120, 420)">
    <circle cx="0" cy="0" r="14" fill="#10b981" stroke="#f8fafc" stroke-width="3"/>
    <rect x="40" y="-35" width="740" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="-12" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="700">TIER 4 (FALLBACK)</text>
    <text x="60" y="10" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Topic Slug Auto-Aliases</text>
    <text x="60" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Natural slug matching extracted from conversation titles (e.g. "Checking Gitignore Status").</text>
    <rect x="530" y="-18" width="230" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="5" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">@agy-gitignore · @agy-subway</text>
  </g>
</svg>
